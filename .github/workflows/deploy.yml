name: Deploy ERP to Cloudflare

on:
  push:
    branches: [main]
    # Other Eternity products and docs live in this repository too; changes
    # that touch only them never redeploy CampusTwin.
    paths-ignore:
      - 'apps/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-erp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check edition boundaries (school, college, university stay separate)
        run: node scripts/arch/check-boundaries.mjs
      - name: Write build env (NEXT_PUBLIC_* are inlined at build)
        run: |
          cat > .env.production.local <<'ENV'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
          DEMO_PASSWORD=${{ secrets.DEMO_PASSWORD }}
          NOTIFY_DISPATCH_KEY=${{ secrets.NOTIFY_DISPATCH_KEY }}
          ENV
      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
      - name: Prepare Next.js at Worker start-up
        run: node scripts/patch-worker.mjs
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
